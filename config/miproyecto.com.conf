# ============================================================
# miproyecto.com.conf — VirtualHost de Apache para la aplicación
# Instalación:
#   sudo cp config/miproyecto.com.conf /etc/apache2/sites-available/
#   sudo a2ensite miproyecto.com
#   sudo a2dissite 000-default
#   sudo systemctl reload apache2
# + /etc/hosts:  127.0.0.1   miproyecto.com
# ============================================================
<VirtualHost *:80>
    ServerName miproyecto.com
    ServerAlias www.miproyecto.com

    ServerAdmin webmaster@miproyecto.com
    DocumentRoot /var/www/miproyecto/public

    <Directory /var/www/miproyecto/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Bloquear acceso a archivos sensibles (defensa en profundidad:
    # el .env vive FUERA del DocumentRoot, en la raíz del proyecto)
    <DirectoryMatch "/var/www/miproyecto/(\.git|sql|scripts|config)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/miproyecto_error.log
    CustomLog ${APACHE_LOG_DIR}/miproyecto_access.log combined
</VirtualHost>
